stages:
  # Raw StatsBomb clone is pinned by its own git SHA (recorded in manifest.yaml),
  # so the manifest stands in for the 14 GB clone as this stage's data dependency.
  staging_statsbomb:
    cmd: python src/ingest/to_parquet.py
    deps:
      - src/ingest/to_parquet.py
      - src/ingest/corpus.py
      - config.yaml
      - manifest.yaml
    outs:
      - data/staging/statsbomb

  validate_staging:
    cmd: python src/ingest/validate.py
    deps:
      - src/ingest/validate.py
      - src/ingest/corpus.py
      - data/staging/statsbomb
    outs:
      - reports/staging_validation.md:
          cache: false

  orientation_check:
    cmd: python src/ingest/orientation_check.py
    deps:
      - src/ingest/orientation_check.py
      - src/ingest/corpus.py
      - data/staging/statsbomb
    outs:
      - reports/orientation_check.md:
          cache: false

  build_views:
    cmd: python src/ingest/build_views.py
    deps:
      - src/ingest/build_views.py
      - src/ingest/corpus.py
      - data/staging/statsbomb
    outs:
      - data/football.duckdb

  identity_join:
    cmd: python src/harmonise/identity_join.py
    deps:
      - src/harmonise/identity_join.py
      - src/harmonise/identity_overrides.csv
      - src/ingest/corpus.py
      - data/staging/statsbomb
      - data/raw/reep
      - data/raw/transfermarkt
    outs:
      - data/identity/player_map.parquet
      - reports/identity_resolution.md:
          cache: false

  spadl_wyscout:
    cmd: python src/harmonise/wyscout_to_spadl.py
    deps:
      - src/harmonise/wyscout_to_spadl.py
      - src/ingest/corpus.py
      - config.yaml
      - data/raw/wyscout
    outs:
      - data/spadl/wyscout

  wyscout_dims:
    cmd: python src/harmonise/wyscout_dims.py
    deps:
      - src/harmonise/wyscout_dims.py
      - src/harmonise/spadl_union.py
      - src/ingest/corpus.py
      - config.yaml
      - data/raw/wyscout
    outs:
      - data/spadl/wyscout_support

  # reads the pinned raw clone via socceraction's maintained loader (manifest = pin proxy)
  spadl_statsbomb:
    cmd: python src/harmonise/to_spadl.py
    deps:
      - src/harmonise/to_spadl.py
      - src/ingest/corpus.py
      - config.yaml
      - manifest.yaml
    outs:
      - data/spadl/statsbomb

  pass_difficulty:
    cmd: python src/features/pass_difficulty.py
    deps:
      - src/features/pass_difficulty.py
      - src/ingest/corpus.py
      - src/harmonise/spadl_union.py
      - data/spadl/statsbomb
      - data/spadl/wyscout
      - data/spadl/wyscout_support
      - data/football.duckdb
    outs:
      - data/features/pass_difficulty_actions.parquet
      - data/features/pass_difficulty_entity.parquet
      - reports/pass_difficulty.md:
          cache: false

  quality:
    cmd: python src/features/quality.py
    deps:
      - src/features/quality.py
      - src/ingest/corpus.py
      - data/football.duckdb
    outs:
      - data/features/player_season_quality.parquet

  build_features:
    cmd: python src/features/build_features.py
    deps:
      - src/features/build_features.py
      - src/ingest/corpus.py
      - src/harmonise/spadl_union.py
      - data/spadl/statsbomb
      - data/spadl/wyscout
      - data/spadl/wyscout_support
      - data/football.duckdb
      - data/features/pass_difficulty_entity.parquet
    outs:
      - data/features/player_season_context.parquet
      - data/features/player_season_team_adjusted.parquet
      - reports/team_deconfounding.md:
          cache: false

  baseline_cosine:
    cmd: python src/models/baseline_cosine.py
    deps:
      - src/models/baseline_cosine.py
      - src/ingest/corpus.py
      - data/features/player_season_team_adjusted.parquet
    outs:
      - data/models/baseline_vectors.parquet
      - data/models/same_player_season_similarity.parquet
      - reports/style_drift.md:
          cache: false

  player_vectors:
    cmd: python src/models/m1_player_vectors.py
    deps:
      - src/models/m1_player_vectors.py
      - src/ingest/corpus.py
      - src/harmonise/spadl_union.py
      - data/spadl/statsbomb
      - data/spadl/wyscout
      - data/spadl/wyscout_support
      - data/football.duckdb
      - data/features/player_season_context.parquet
    outs:
      - data/models/player_vectors.parquet
      - reports/player_vectors.md:
          cache: false
      - reports/figures/player_vectors_map.png:
          cache: false

  baseline_neighbours:
    cmd: python src/models/neighbours.py
    deps:
      - src/models/neighbours.py
      - src/models/trajectories.py
      - src/ingest/corpus.py
      - data/models/baseline_vectors.parquet
    outs:
      - data/models/baseline_neighbours.parquet
      - reports/baseline_neighbours.md:
          cache: false
